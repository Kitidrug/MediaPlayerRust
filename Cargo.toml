[package]
name = "media_player"
version = "0.1.0"
edition = "2021"
authors = ["Senior Multimedia Developer"]
description = "Cross-platform high-performance Media Player in Rust with GStreamer and egui"

[dependencies]
# GStreamer Rust bindings
gstreamer = "0.22"
gstreamer-app = "0.22"
gstreamer-video = "0.22"

# GUI framework (pure Rust, cross-platform, hardware-accelerated)
eframe = { version = "0.27", default-features = true }
egui = "0.27"

# Concurrency & Channels
crossbeam-channel = "0.5"

# Zero-copy memory conversion for ultra-fast frame transfers
bytemuck = "1.16"

# Native file dialogs (cross-platform: Windows, Linux, macOS)
rfd = "0.14"

# URL parsing and formatting
url = "2.5"

# Persistence & State saving
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
